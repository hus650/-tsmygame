<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>It's My Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060a;--ink:#e8e4d8;--tox:#7dff4a;--mag:#ff2e8a;--cy:#3ad7ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:'Barlow Condensed',Impact,sans-serif;overflow:hidden}
#w{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative}canvas{display:block;background:#000;max-width:100%;transition:filter .8s ease}canvas.dim{filter:brightness(.28) saturate(.6)}body.hq canvas.dim{filter:brightness(.28) blur(3px) saturate(.6)}
.ov{position:fixed;inset:0;z-index:20;overflow:auto;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:12px;box-sizing:border-box}
h1{font:64px 'Rubik Wet Paint',Impact,sans-serif;color:var(--tox);margin:0 0 18px;text-shadow:0 0 24px #3a8a1a,0 4px 0 #1a3a0a;letter-spacing:2px}
button{font:700 24px 'Barlow Condensed',Impact,sans-serif;color:var(--ink);background:#14101a;border:2px solid var(--mag);padding:10px 42px;min-width:230px;cursor:pointer;box-shadow:0 0 14px #ff2e8a55;transition:transform .1s,background .1s}
button:hover,button:focus-visible{background:var(--mag);transform:scale(1.05);outline:none}
button:disabled{opacity:.35;cursor:default;border-color:#555;box-shadow:none}
#cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.cd{width:clamp(110px,28vw,190px);padding:clamp(8px,2vmin,16px);background:#120e18ee;border:2px solid var(--cy);cursor:pointer;box-shadow:0 0 16px #3ad7ff44}
.cd:hover{background:#1c1630;transform:translateY(-6px)}.cd b{display:block;font-size:clamp(16px,3.4vmin,24px);color:var(--cy)}.cd span{font-size:clamp(13px,2.6vmin,18px);opacity:.85}
#mute{position:absolute;right:10px;top:10px;min-width:0;padding:4px 12px;font-size:16px;z-index:3}
</style></head><body><div id="w"><div id="stage"><canvas id="c" width="1280" height="720"></canvas>
<button id="mute">SOUND ON</button>
<div class="ov" id="menu"><h1>IT'S MY GAME</h1><button id="bn">New Game</button><button id="bc">Continue</button><button id="bk">Controls</button><div style="opacity:.6;font-size:18px">Keyboard + mouse or touch · rebind keys in Controls</div></div>
<div class="ov" id="pick" style="background:radial-gradient(#0000 25%,#000c)"><h1 id="ph" style="font-size:40px">Level up</h1><div id="cards"></div><button id="rrb">Reroll</button></div><div class="ov" id="altar" style="background:#000c"></div><div class="ov" id="keys" style="background:#000d"></div><div class="ov" id="pause" style="background:#000a"><h1>Paused</h1><button id="pr">Resume</button><button id="pc">Controls</button><button id="pq">Abandon run</button></div>
<div class="ov" id="over" style="background:#200008cc"><h1 style="color:var(--mag)">You turned</h1><div id="os" style="font-size:24px"></div><button id="br">Back to camp</button></div>
</div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=1280,H=720,$=i=>document.getElementById(i);
const R=Math.random,rr=(a,b)=>a+R()*(b-a),TAU=Math.PI*2,dist=(a,b,c,d)=>Math.sqrt((a-c)*(a-c)+(b-d)*(b-d));
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px';$('stage').style.width=W*s+'px';$('stage').style.height=H*s+'px';document.querySelectorAll('.ov').forEach(o=>o.style.fontSize=s*16+'px')}
addEventListener('resize',()=>fit());addEventListener('orientationchange',()=>setTimeout(()=>fit(),120));fit();
/* ---------- audio ---------- */
let AC,mute=false;const lastS={};
function au(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(f,d,ty='square',v=.06,sl=0,k){const n=performance.now();if(k&&n-(lastS[k]||0)<45)return;lastS[k]=n;if(mute||!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
function nz(d,v=.1,fr=1200,k){const n=performance.now();if(k&&n-(lastS[k]||0)<50)return;lastS[k]=n;if(mute||!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(R()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fr;g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start()}
const sfx={shoot:()=>{tone(420,.08,'square',.05,-300,'s');nz(.05,.05,3000,'s2')},shot:()=>{nz(.2,.18,1500,'sh');tone(110,.15,'sawtooth',.08,-60,'sh2')},ar:()=>tone(300,.05,'square',.04,-150,'ar'),snip:()=>{tone(900,.3,'sawtooth',.07,-800);nz(.2,.1,5000)},flame:()=>nz(.08,.04,900,'fl'),zap:()=>tone(1200,.12,'sawtooth',.05,-900,'zp'),rock:()=>{tone(160,.3,'sawtooth',.08,-100);nz(.3,.1,800)},boom:()=>{nz(.5,.3,600);tone(70,.4,'sine',.2,-40)},slash:()=>{nz(.12,.09,4000,'sl');tone(700,.1,'triangle',.04,-400)},hit:()=>tone(180,.06,'square',.05,-80,'h'),groan:()=>tone(rr(70,110),.5,'sawtooth',.04,-25,'g'),lvl:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.08),i*90)),click:()=>tone(600,.05,'square',.05),hurt:()=>{tone(120,.25,'sawtooth',.1,-80);nz(.15,.1,500)},gem:()=>tone(900+rr(0,300),.06,'sine',.04,0,'gm'),mut:()=>{tone(60,1.5,'sawtooth',.15,300);nz(1,.2,300)}};
/* ---------- input ---------- */
const K={};let mx=W/2,my=H/2,md=false,autoAim=true;
addEventListener('keydown',e=>{au();K[LG(e.code)]=1;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>K[LG(e.code)]=0);
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height});
C.addEventListener('mousedown',()=>{au();md=true});addEventListener('mouseup',()=>md=false);
function tmute(){mute=!mute;$('mute').textContent=mute?'SOUND OFF':'SOUND ON'}$('mute').onclick=()=>{au();tmute()};
/* ---------- data ---------- */
const WD={pistol:{n:'Rusty Pistol',cd:.45,d:12,c:'#ffd24a'},shotgun:{n:'Sawed-Off',cd:1.1,d:7,c:'#ff8a3a'},rifle:{n:'Assault Rifle',cd:.13,d:6,c:'#9aff7a'},sniper:{n:'Sniper Rifle',cd:1.4,d:60,c:'#ff4a4a'},flame:{n:'Flamethrower',cd:.06,d:2.5,c:'#ff6a1a'},chain:{n:'Chain Lightning',cd:.8,d:14,c:'#6ad7ff'},rocket:{n:'Rocket Launcher',cd:1.6,d:30,c:'#ff5a8a'},katana:{n:'Plasma Blade',cd:.6,d:22,c:'#c07aff'},saw:{n:'Orbital Sawblades',cd:1,d:9,c:'#cfd6dd'},bio:{n:'Mutant Bio-Cannon',cd:.9,d:16,c:'#7dff4a'}};
const ET={sh:{r:14,hp:32,sp:55,dm:8,c:'#6f8f4a',xp:1,kb:1},sp:{r:11,hp:16,sp:110,dm:6,c:'#c9c24a',xp:1,kb:1.3},br:{r:27,hp:240,sp:36,dm:20,c:'#6a3a5a',xp:6,kb:.12},spit:{r:13,hp:28,sp:60,dm:5,c:'#2fcf8a',xp:2,kb:1},exp:{r:15,hp:30,sp:115,dm:5,c:'#ff7a1a',xp:2,kb:1}};
let S='menu',P,room=1,E=[],B=[],PT=[],TX=[],GM=[],AR=[],spawnLeft=0,spawnT=0,clearT=0,shake=0,hs=0,fade=0,fadeCb=null,t0=0,tm=0,flash=0,banner=null,pickQ=0,orbA=0;
let RQ=1;const need=l=>RQ||1;
function newPlayer(){return{x:300,y:360,hp:100,mh:100,spd:200,pdm:1,lvl:1,xp:0,ws:[{id:'pistol',lv:1,cd:0}],inv:0,face:1,bob:0,mv:0}}
function save(){try{localStorage.setItem('imgsave',JSON.stringify({lvl:P.lvl,xp:P.xp,room,ws:P.ws.map(w=>({id:w.id,lv:w.lv,cd:0})),mh:P.mh,spd:P.spd,pdm:P.pdm}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('imgsave'))}catch(e){return null}}
/* ---------- state flow ---------- */
function go(cb){fadeCb=cb;fade=.001}
function showOv(id){['menu','pick','over','altar','keys','pause'].forEach(o=>$(o).style.display=o==id?'flex':'none')}
function toMenu(){S='menu';showOv('menu');$('bc').disabled=!load()}
$('bn').onclick=()=>{au();sfx.click();try{localStorage.removeItem('imgsave')}catch(e){}P=newPlayer();room=1;go(()=>{S='hub';P.x=200;P.y=420;showOv('')})};
$('bc').onclick=()=>{au();sfx.click();const s=load();if(!s)return;P=Object.assign(newPlayer(),s);room=s.room;go(()=>{S='hub';P.x=200;P.y=420;showOv('')})};
$('br').onclick=()=>{sfx.click();P=newPlayer();room=1;go(()=>{S='hub';P.x=200;P.y=420;showOv('')})};
function enterArena(){E=[];B=[];PT=[];TX=[];GM=[];AR=[];P.x=W/2;P.y=H/2+30;P.hp=Math.min(P.mh,P.hp+30);startRoom()}
function startRoom(){spawnLeft=5+room*3;spawnT=1;clearT=0;banner={t:2.2,s:'ROOM '+room}; save()}
/* ---------- helpers ---------- */
function burst(x,y,n,c,sp=200,l=.5,g=0){for(let i=0;i<n;i++){const a=R()*TAU,s=rr(.2,1)*sp;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,m:l,c,r:rr(1.5,4),g})}}
function ftx(x,y,s,c='#fff',big=0){TX.push({x,y,s,c,l:.8,big})}
function pMul(){return 1+.04*P.lvl}
function wDmg(w){return WD[w.id].d*pMul()*(1+.18*(w.lv-1))*P.pdm*(P.lvl>=20?1.12:1)}
function wCd(w){return WD[w.id].cd/((1+.012*Math.min(P.lvl,60))*(1+.08*(w.lv-1))*(P.lvl>=20?1.08:1))}
function addXp(n){if(P.lvl>=20)return;P.xp+=n;while(P.xp>=need(P.lvl)&&P.lvl<20){P.xp-=need(P.lvl);P.lvl++;P.mh+=8;P.hp=Math.min(P.mh,P.hp+25);P.spd+=2;sfx.lvl();flash=.3;ftx(P.x,P.y-50,'LEVEL '+P.lvl,'#ffe14a',1);burst(P.x,P.y,25,'#ffe14a',260,.7);
if(P.lvl==20){sfx.mut();shake=30;hs=.3;flash=1.2;banner={t:3.5,s:'MUTANT FORM'};P.xp=0;burst(P.x,P.y,120,'#ff2e8a',500,1.2)}}}
function spawn(){const side=Math.floor(R()*4);let x,y;if(side==0){x=rr(70,W-70);y=80}else if(side==1){x=rr(70,W-70);y=H-50}else if(side==2){x=60;y=rr(100,H-50)}else{x=W-60;y=rr(100,H-50)}
const pool=['sh','sh','sh'];if(room>=2)pool.push('sp','sp');if(room>=3)pool.push('exp');if(room>=4)pool.push('spit','spit');if(room>=5)pool.push('br');let t=pool[Math.floor(R()*pool.length)];
const d=ET[t],f=1+(room-1)*.12;E.push({t,x,y,hp:d.hp*f,mh:d.hp*f,r:d.r,kx:0,ky:0,burn:0,bt:0,cd:rr(1,2),tel:0,fuse:0,dash:0,ph:R()*9,sa:0,hurt:0});burst(x,y,8,d.c,90,.4);if(R()<.15)sfx.groan()}
function dmgE(e,d,ang,kb=1,burn=0,col){e.hp-=d;e.hurt=.1;const k=ET[e.t].kb*kb*120;e.kx+=Math.cos(ang)*k;e.ky+=Math.sin(ang)*k;if(burn)e.burn=3;
ftx(e.x+rr(-8,8),e.y-e.r-6,Math.ceil(d),col||(d>30?'#ff5a3a':'#fff'),d>30);burst(e.x,e.y,3,'#a01818',150,.4);sfx.hit();if(d>25&&d>e.mh*.2)hs=Math.max(hs,.04)
if(e.hp<=0&&!e.dead){e.dead=1;const dd=ET[e.t];burst(e.x,e.y,16,dd.c,260,.6);burst(e.x,e.y,8,'#8a0f0f',200,.7);gem(e.x,e.y,dd.xp,rr(-60,60),rr(-60,60));if(e.t=='br'){shake=Math.max(shake,12);for(let i=0;i<3;i++)gem(e.x+rr(-20,20),e.y+rr(-20,20),dd.xp/3,rr(-90,90),rr(-90,90))}
if(e.t=='exp')boom(e.x,e.y,90,40,true)}}
function boom(x,y,r,d,fromE){sfx.boom();shake=Math.max(shake,fromE?10:14);burst(x,y,40,'#ff9a2a',380,.7);burst(x,y,20,'#fff4a0',300,.4);AR.push({k:'ring',x,y,r,l:.35,m:.35});
for(const e of E)if(!e.dead&&dist(e.x,e.y,x,y)<r+e.r)dmgE(e,d,Math.atan2(e.y-y,e.x-x),3);if(fromE&&dist(P.x,P.y,x,y)<r+14)hurtP(25)}
function hurtP(d){if(P.inv>0||S!='arena')return;P.hp-=d;P.inv=.45;shake=Math.max(shake,8);hs=.06;sfx.hurt();flash=.15;burst(P.x,P.y,14,'#b01818',220,.5);ftx(P.x,P.y-40,'-'+Math.ceil(d),'#ff4a4a',1);
if(P.hp<=0){S='over';try{localStorage.removeItem('imgsave')}catch(e){}$('os').textContent='Reached Room '+room+' · Level '+P.lvl;showOv('over')}}
function nearest(x,y,rg){let b=null,bd=rg;for(const e of E){if(e.dead)continue;const d=dist(x,y,e.x,e.y);if(d<bd){bd=d;b=e}}return b}
function pr(x,y,a,sp,d,o){B.push(Object.assign({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,d,r:4,l:1.2,p:0,t:'b',h:new Set,c:'#ffd24a'},o))}
/* ---------- weapons ---------- */
function slotPos(i,n){const a=orbA*.6+i*TAU/n,rd=(26+Math.min(P.lvl,20)*.7);return[P.x+Math.cos(a)*rd,P.y+Math.sin(a)*rd]}
function fireW(w,i,n){const id=w.id,[x,y]=slotPos(i,n);if(id=='saw')return;
let tg=null,ang;if(autoAim){tg=nearest(x,y,id=='sniper'?900:id=='flame'?230:id=='katana'?150:id=='chain'?330:520);if(!tg)return;ang=Math.atan2(tg.y-y,tg.x-x)}else{if(!E.length)return;ang=Math.atan2(my-y,mx-x)}
w.cd=wCd(w);const d=wDmg(w),sc=1+.02*P.lvl,rc=3;w.rec=.12;w.ang=ang;const mxp=x+Math.cos(ang)*18,myp=y+Math.sin(ang)*18;
if(id=='pistol'){pr(mxp,myp,ang,640,d,{r:4*sc,c:'#ffd24a'});sfx.shoot()}
else if(id=='shotgun'){for(let k=0;k<7;k++)pr(mxp,myp,ang+rr(-.28,.28),rr(500,700),d,{r:3*sc,l:.3,kb:3,c:'#ff8a3a'});sfx.shot();shake=Math.max(shake,5);burst(mxp,myp,6,'#ffb050',250,.2)}
else if(id=='rifle'){pr(mxp,myp,ang+rr(-.06,.06),800,d,{r:3*sc,c:'#9aff7a'});sfx.ar()}
else if(id=='sniper'){pr(mxp,myp,ang,1500,d,{r:4*sc,p:99,l:1,c:'#ff4a4a'});sfx.snip();shake=Math.max(shake,4)}
else if(id=='flame'){for(let k=0;k<2;k++)pr(mxp,myp,ang+rr(-.15,.15),rr(260,360),d,{r:rr(6,11)*sc,l:.35,p:99,burn:1,t:'f',c:'#ff7a1a'});sfx.flame()}
else if(id=='chain'){let cur=tg||{x:mx,y:my},px=x,py=y,hit=new Set,dd=d;for(let k=0;k<4+Math.floor(w.lv/2);k++){if(!cur)break;AR.push({k:'arc',x1:px,y1:py,x2:cur.x,y2:cur.y,l:.18,m:.18});if(cur.hp!==undefined){hit.add(cur);dmgE(cur,dd,ang,.4,0,'#6ad7ff')}px=cur.x;py=cur.y;let nx=null,nd=170;for(const e of E)if(!e.dead&&!hit.has(e)){const q=dist(px,py,e.x,e.y);if(q<nd){nd=q;nx=e}}cur=nx}sfx.zap()}
else if(id=='rocket'){pr(mxp,myp,ang,420,d,{r:6*sc,l:2,t:'r',c:'#ff5a8a'});sfx.rock();shake=Math.max(shake,5)}
else if(id=='katana'){const rg=100+P.lvl*2;AR.push({k:'slash',x,y,a:ang,r:rg,l:.2,m:.2});sfx.slash();for(const e of E){if(e.dead)continue;const q=dist(x,y,e.x,e.y);let da=Math.abs(((Math.atan2(e.y-y,e.x-x)-ang+Math.PI*3)%TAU)-Math.PI);if(q<rg+e.r&&da<1.1)dmgE(e,d,ang,1.5,0,'#c07aff')}for(const b of B)if(b.hs&&dist(x,y,b.x,b.y)<rg){b.l=0;burst(b.x,b.y,6,'#c07aff',150,.3)}}
else if(id=='bio'){pr(mxp,myp,ang,330,d,{r:8*sc,l:3,t:'o',bn:2+Math.floor(w.lv/3),g:0,c:'#7dff4a'});tone(200,.2,'sine',.07,300,'bio')}}
function updWeapons(dt){const n=P.ws.length;orbA+=dt;P.ws.forEach((w,i)=>{w.cd-=dt;w.rec=Math.max(0,(w.rec||0)-dt);if(w.cd<=0)fireW(w,i,n)});
const sw=P.ws.find(w=>w.id=='saw');if(sw){const c=2+sw.lv,rd=75+P.lvl*1.5;for(let k=0;k<c;k++){const a=orbA*4+k*TAU/c,sx=P.x+Math.cos(a)*rd,sy=P.y+Math.sin(a)*rd;for(const e of E){if(e.dead)continue;e.sw=(e.sw||0)-dt;if(e.sw<=0&&dist(sx,sy,e.x,e.y)<e.r+16){e.sw=.2;dmgE(e,wDmg(sw),a+1.57,1,0,'#cfd6dd');burst(sx,sy,3,'#cfd6dd',200,.2)}}}}}
/* ---------- update ---------- */
function updArena(dt){
let dx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),dy=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);const m=Math.hypot(dx,dy);P.mv=m?1:0;if(m){P.x+=dx/m*P.spd*dt;P.y+=dy/m*P.spd*dt;P.bob+=dt*12;if(dx)P.face=dx}
P.x=Math.max(70,Math.min(W-70,P.x));P.y=Math.max(100,Math.min(H-70,P.y));P.inv-=dt;
if(clearT==0){updWeapons(dt);spawnTick(dt)}
for(const e of E){if(e.dead)continue;const d=dist(e.x,e.y,P.x,P.y)||1,ux=(P.x-e.x)/d,uy=(P.y-e.y)/d,T=ET[e.t];e.hurt-=dt;e.ph+=dt*6;let sp=T.sp*(e.burn>0?1:1),vx=ux*sp,vy=uy*sp;e.cd-=dt;
if(e.burn>0){e.burn-=dt;e.bt-=dt;if(e.bt<=0){e.bt=.25;dmgE(e,3*P.pdm*pMul(),0,0,0,'#ff8a2a')}}
if(e.t=='sp'){if(e.dash>0){e.dash-=dt;vx=ux*420;vy=uy*420}else if(d<170&&e.cd<=0){e.dash=.3;e.cd=2}}
if(e.t=='spit'){if(d<230){vx=-ux*sp;vy=-uy*sp}else if(d<330){vx=vy=0}if(e.tel>0){vx=vy=0;e.tel-=dt;if(e.tel<=0)pr(e.x,e.y,Math.atan2(P.y-e.y,P.x-e.x),260,10,{r:7,l:3,hs:1,hostile:1,c:'#8aff4a'})}else if(e.cd<=0&&d<420){e.tel=.7;e.cd=2.6}}
if(e.t=='exp'){if(d<90&&!e.fuse)e.fuse=.9;if(e.fuse>0){e.fuse-=dt;vx*=.3;vy*=.3;if(e.fuse<=0){e.dead=1;boom(e.x,e.y,95,45,true);continue}}}
